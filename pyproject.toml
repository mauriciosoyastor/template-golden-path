[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "template-golden-path"
version = "0.1.0"
description = "Template Golden Path Fusion — opencode"
requires-python = ">=3.12"

[project.optional-dependencies]
dev = ["ruff", "mypy", "pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["tu_paquete*"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = []
per-file-ignores = { "harness/harness.py" = ["E501", "F841"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
warn_unused_ignores = false
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["numpy.*", "cv2.*", "fastapi.*", "onnxruntime.*", "mediapipe.*", "PIL.*", "mujoco.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["harness.*", "harness.harness"]
ignore_errors = true

[dependency-groups]
dev = ["ruff", "mypy", "pytest"]
